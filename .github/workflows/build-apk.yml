name: Build & Publish slu1pik APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Prepare Web App & Inject Version
        run: |
          mkdir -p www
          cp index.html www/index.html
          sed -i "s|__GITHUB_REPO__|${{ github.repository }}|g" www/index.html
          sed -i "s|__APP_VERSION__|${{ github.run_number }}|g" www/index.html

      - name: Initialize Android Project
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "slu1pik" "com.slu1pik.liquidcalendar" --web-dir www
          npx cap add android

      - name: Generate and Inject slu1pik Icons
        run: |
          cat << 'EOF' > icon.svg
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
            <rect width="512" height="512" rx="115" fill="#08080c"/>
            <rect x="65" y="75" width="382" height="372" rx="65" fill="#1b1b24" stroke="#ffffff" stroke-opacity="0.35" stroke-width="6"/>
            <rect x="140" y="45" width="26" height="60" rx="13" fill="#ffffff"/>
            <rect x="346" y="45" width="26" height="60" rx="13" fill="#ffffff"/>
            <line x1="65" y1="165" x2="447" y2="165" stroke="#ffffff" stroke-opacity="0.25" stroke-width="4"/>
            <text x="256" y="138" fill="#ffffff" font-family="sans-serif" font-size="28" font-weight="800" text-anchor="middle" letter-spacing="4">CALENDAR</text>
            <circle cx="155" cy="235" r="14" fill="#ffffff" fill-opacity="0.35"/>
            <circle cx="256" cy="235" r="14" fill="#ffffff" fill-opacity="0.35"/>
            <circle cx="357" cy="235" r="14" fill="#ffffff"/>
            <circle cx="155" cy="300" r="14" fill="#ffffff" fill-opacity="0.35"/>
            <circle cx="256" cy="300" r="14" fill="#ffffff"/>
            <circle cx="357" cy="300" r="14" fill="#ffffff"/>
            <text x="256" y="405" fill="#ffffff" font-family="sans-serif" font-size="64" font-weight="900" text-anchor="middle">slu1pik</text>
          </svg>
          EOF

          # Создаем иконки всех размеров напрямую для Android
          RES_DIR="android/app/src/main/res"
          convert -background none -resize 48x48 icon.svg $RES_DIR/mipmap-mdpi/ic_launcher.png
          convert -background none -resize 72x72 icon.svg $RES_DIR/mipmap-hdpi/ic_launcher.png
          convert -background none -resize 96x96 icon.svg $RES_DIR/mipmap-xhdpi/ic_launcher.png
          convert -background none -resize 144x144 icon.svg $RES_DIR/mipmap-xxhdpi/ic_launcher.png
          convert -background none -resize 192x192 icon.svg $RES_DIR/mipmap-xxxhdpi/ic_launcher.png
          
          # Круглые иконки
          cp $RES_DIR/mipmap-mdpi/ic_launcher.png $RES_DIR/mipmap-mdpi/ic_launcher_round.png
          cp $RES_DIR/mipmap-hdpi/ic_launcher.png $RES_DIR/mipmap-hdpi/ic_launcher_round.png
          cp $RES_DIR/mipmap-xhdpi/ic_launcher.png $RES_DIR/mipmap-xhdpi/ic_launcher_round.png
          cp $RES_DIR/mipmap-xxhdpi/ic_launcher.png $RES_DIR/mipmap-xxhdpi/ic_launcher_round.png
          cp $RES_DIR/mipmap-xxxhdpi/ic_launcher.png $RES_DIR/mipmap-xxxhdpi/ic_launcher_round.png

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../slu1pik-calendar.apk

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: slu1pik-calendar-APK
          path: slu1pik-calendar.apk

      - name: Publish to GitHub Releases
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: "slu1pik Calendar v1.${{ github.run_number }}"
          body: "Релиз приложения Liquid Glass Calendar от slu1pik с иконкой и автообновлением."
          files: slu1pik-calendar.apk
