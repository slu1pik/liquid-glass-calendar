name: Build & Publish slu1pik APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install SVG to PNG converter
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin

      - name: Inject Version & Generate slu1pik App Icon
        run: |
          mkdir -p www assets
          cp index.html www/index.html

          # Вшиваем адрес репозитория и номер версии для автообновлений
          sed -i "s|__GITHUB_REPO__|${{ github.repository }}|g" www/index.html
          sed -i "s|__APP_VERSION__|${{ github.run_number }}|g" www/index.html

          # Генерируем иконку приложения "календарь slu1pik" (1024x1024)
          cat << 'EOF' > icon.svg
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
            <defs>
              <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#141419"/>
                <stop offset="50%" stop-color="#08080c"/>
                <stop offset="100%" stop-color="#1f1f29"/>
              </linearGradient>
              <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28"/>
                <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
              </linearGradient>
            </defs>
            <rect width="1024" height="1024" rx="220" fill="url(#bg)"/>
            <path d="M0 680 Q 256 580 512 680 T 1024 660 L 1024 1024 L 0 1024 Z" fill="#ffffff" fill-opacity="0.06"/>
            <path d="M0 760 Q 300 660 600 760 T 1024 740 L 1024 1024 L 0 1024 Z" fill="#ffffff" fill-opacity="0.1"/>
            <rect x="140" y="150" width="744" height="724" rx="130" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.45" stroke-width="8"/>
            <rect x="290" y="100" width="44" height="110" rx="22" fill="#ffffff"/>
            <rect x="690" y="100" width="44" height="110" rx="22" fill="#ffffff"/>
            <line x1="140" y1="320" x2="884" y2="320" stroke="#ffffff" stroke-opacity="0.3" stroke-width="6"/>
            <text x="512" y="265" fill="#ffffff" font-family="sans-serif" font-size="56" font-weight="800" text-anchor="middle" letter-spacing="8">CALENDAR</text>
            <circle cx="310" cy="450" r="24" fill="#ffffff" fill-opacity="0.4"/>
            <circle cx="512" cy="450" r="24" fill="#ffffff" fill-opacity="0.4"/>
            <circle cx="714" cy="450" r="24" fill="#ffffff"/>
            <circle cx="310" cy="560" r="24" fill="#ffffff" fill-opacity="0.4"/>
            <circle cx="512" cy="560" r="24" fill="#ffffff"/>
            <circle cx="714" cy="560" r="24" fill="#ffffff" fill-opacity="0.4"/>
            <text x="512" y="775" fill="#ffffff" font-family="sans-serif" font-size="135" font-weight="900" text-anchor="middle">slu1pik</text>
          </svg>
          EOF

          rsvg-convert -w 1024 -h 1024 icon.svg -o assets/icon.png
          rsvg-convert -w 2732 -h 2732 icon.svg -o assets/splash.png

      - name: Build Capacitor Android Project & Apply Icons
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/assets
          npx cap init "slu1pik" "com.slu1pik.liquidcalendar" --web-dir www
          npx cap add android
          npx @capacitor/assets generate --android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../slu1pik-calendar.apk

      - name: Upload APK to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: slu1pik-calendar-APK
          path: slu1pik-calendar.apk

      - name: Publish Auto-Update Release on GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: "slu1pik Calendar v1.${{ github.run_number }}"
          body: "Автоматическое обновление Liquid Glass Calendar от slu1pik."
          files: slu1pik-calendar.apk
